<!DOCTYPE html>
<html lang="en">
<head>
  <title>Forecaster</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Control the Forecaster weather LED display">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="application-name" content="Forecaster">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forecaster">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./main.css" >
  <script src="./htmx.js"></script>
  <!-- <script src="./app.js" defer></script> -->
</head>
<body>
  <header>
    <h1>FORECASTER</h1>
    <button id="info-btn" type="button" aria-label="About">i</button>
  </header>
<!-- 
  <div id="state">
    <div class="mode-name text-gradient">Loading...</div>
  </div> -->

  <div id="state">
    <div class="weather-info">
      <div class="weather-condition">Rainy</div>
      <div class="weather-temp text-gradient">25.4 °C</div>
      <div class="weather-details">
        <span class="wind-arrow" style="display:inline-block; transform: rotate(90deg);">&#8593;</span>
        SW · 10 m/s Light rain
      </div>
    </div>    
    <div class="buttons">
      <button type="button" class="{{lightClass}}" hx-post="/mode" hx-vals='{"set":"LIGHT"}' hx-swap="none">LIGHT</button>
      <button type="button" class="{{ambientClass}}" hx-post="/mode" hx-vals='{"set":"AMBIENT"}' hx-swap="none">AMBIENT</button>
      <button type="button" class="{{forecastClass}}" hx-post="/mode" hx-vals='{"set":"FORECAST"}' hx-swap="none">FORECAST</button>
    </div>
  </div>
  
  <div id="info-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2>FORECASTER v1.0</h2>
      <p>Tim Cherniavski<br>&times;<br>varloc2000@gmail.com</p>
      <div class="buttons">
        <button type="button" id="reconfigure-btn">RECONFIGURE</button>
        <button type="button" id="demo-btn" hx-post="/mode" hx-vals='{"set":"TESTING"}' hx-on::after-request="document.getElementById('info-modal').hidden = true">DEMO</button>
        <button type="button" id="modal-close-btn">Close</button>
      </div>
    </div>
  </div>
</body>
</html>
